<svg xmlns="http://www.w3.org/2000/svg" width="800" height="654" viewBox="0 0 800 654" role="img" aria-labelledby="title description">
  <title id="title">Two cancers in one patient: preserve the evidence, then choose what to count</title>
  <desc id="description">Patient P1 has two lung primaries. Cancer A has stage III recorded on 10 January and radiotherapy starts on 20 January and 15 February. Cancer B has stage III recorded on 1 April but no radiotherapy recorded. Both cancers are eligible; only A meets the radiotherapy criterion. Counting cancers gives numerator 1 and denominator 2. Counting patients gives numerator 1 and denominator 1. Repeated records do not add cancer results, and A's treatment cannot qualify B. This example has no date window.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#526174" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #213047; }
      .heading { font-size: 24px; font-weight: 650; }
      .label { font-size: 20px; font-weight: 650; }
      .body { font-size: 19px; }
      .note { font-size: 18px; fill: #526174; }
      .count { font-size: 34px; font-weight: 700; }
      .connector { fill: none; stroke: #526174; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="800" height="654" rx="12" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" class="heading">One patient (P1), two lung primaries</text>
  <text x="400" y="65" text-anchor="middle" class="body">Indicator: stage III cancer with recorded radiotherapy (RT)</text>
  <text x="400" y="92" text-anchor="middle" class="note">No date window in this example</text>

  <rect x="20" y="116" width="370" height="204" rx="10" fill="#edf5ff" stroke="#739bd0" stroke-width="1.5"/>
  <text x="42" y="151" class="label">Cancer A</text>
  <text x="42" y="190" class="body">10 Jan · Stage III</text>
  <text x="42" y="223" class="body">20 Jan · RT starts</text>
  <text x="42" y="256" class="body">15 Feb · Further RT starts</text>
  <text x="42" y="296" class="note">Keep all three records as evidence.</text>

  <rect x="410" y="116" width="370" height="204" rx="10" fill="#f5f0ff" stroke="#a18abb" stroke-width="1.5"/>
  <text x="432" y="151" class="label">Cancer B</text>
  <text x="432" y="190" class="body">1 Apr · Stage III</text>
  <text x="432" y="223" class="body">No RT recorded for this cancer</text>
  <text x="432" y="296" class="note">A’s RT cannot qualify B.</text>

  <path d="M205 321 V350" class="connector"/>
  <path d="M595 321 V350" class="connector"/>
  <rect x="20" y="358" width="370" height="91" rx="10" fill="#f0f8f4" stroke="#7aa58a" stroke-width="1.5"/>
  <text x="42" y="390" class="label">One result for A</text>
  <text x="42" y="424" class="body">Eligible · RT criterion met</text>
  <rect x="410" y="358" width="370" height="91" rx="10" fill="#f7f8fa" stroke="#9ba5b2" stroke-width="1.5"/>
  <text x="432" y="390" class="label">One result for B</text>
  <text x="432" y="424" class="body">Eligible · RT not demonstrated</text>

  <text x="400" y="491" text-anchor="middle" class="label">The same cancer results, two ways to report</text>
  <rect x="20" y="512" width="370" height="122" rx="10" fill="#ffffff" stroke="#bac3cf" stroke-width="1.5"/>
  <text x="42" y="545" class="label">Count cancers</text>
  <text x="42" y="591" class="count">1 / 2</text>
  <text x="155" y="580" class="body">One of two eligible</text>
  <text x="155" y="606" class="body">cancers meets it.</text>
  <rect x="410" y="512" width="370" height="122" rx="10" fill="#ffffff" stroke="#bac3cf" stroke-width="1.5"/>
  <text x="432" y="545" class="label">Count patients</text>
  <text x="432" y="591" class="count">1 / 1</text>
  <text x="545" y="580" class="body">P1 has an eligible</text>
  <text x="545" y="606" class="body">cancer that meets it.</text>
</svg>
