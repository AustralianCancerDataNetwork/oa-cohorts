<svg xmlns="http://www.w3.org/2000/svg" width="800" height="578" viewBox="0 0 800 578" role="img" aria-labelledby="title description">
  <title id="title">Filter assessments by the treatment window before selecting one</title>
  <desc id="description">The allowed window is 10 to 20 March inclusive. An assessment on 1 March is outside it; one on 15 March is inside. Choosing the earliest before filtering misses valid evidence. Filtering first retains the 15 March assessment.</desc>
  <style>text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #213047; }
.heading { font-size: 24px; font-weight: 650; }
.label { font-size: 20px; font-weight: 650; }
.body { font-size: 19px; }
.note { font-size: 18px; fill: #526174; }
.small { font-size: 17px; fill: #526174; }
.grid { stroke: #dce3ec; stroke-width: 1; }
.axis { stroke: #526174; stroke-width: 1.5; }</style>
  <rect width="800" height="578" rx="12" fill="#ffffff"/>
  <text x="400" y="34" class="heading" text-anchor="middle">Check the window before choosing an assessment</text>
  <text x="400" y="66" class="body" text-anchor="middle">Same cancer · RT starts 20 March · assessments on 1 and 15 March</text>
  <rect x="383" y="118" width="337" height="126" rx="6" fill="#f0f8f4" stroke="#7aa58a" stroke-width="1.5"/>
  <text x="552" y="148" class="label" text-anchor="middle">Allowed assessment window</text>
  <text x="552" y="178" class="note" text-anchor="middle">10–20 March, inclusive</text>
  <line x1="80" y1="230" x2="720" y2="230" class="axis"/>
  <line x1="80" y1="222" x2="80" y2="240" class="axis"/>
  <text x="80" y="270" class="note" text-anchor="middle">1 March</text>
  <line x1="383" y1="222" x2="383" y2="240" class="axis"/>
  <text x="383" y="270" class="note" text-anchor="middle">10 March</text>
  <line x1="552" y1="222" x2="552" y2="240" class="axis"/>
  <text x="552" y="270" class="note" text-anchor="middle">15 March</text>
  <line x1="720" y1="222" x2="720" y2="240" class="axis"/>
  <text x="720" y="270" class="note" text-anchor="middle">20 March</text>
  <path d="M80 223 L87 230 L80 237 L73 230 Z" fill="#9ba5b2" stroke="#ffffff"/>
  <path d="M552 223 L559 230 L552 237 L545 230 Z" fill="#5b9471" stroke="#ffffff"/>
  <line x1="720" y1="196" x2="720" y2="244" class="axis" style="stroke:#739bd0"/>
  <text x="80" y="204" class="note" text-anchor="middle">Assessment</text>
  <text x="552" y="304" class="note" text-anchor="middle">Assessment</text>
  <text x="720" y="304" class="note" text-anchor="middle">RT starts</text>
  <rect x="20" y="346" width="370" height="170" rx="10" fill="#f7f8fa" stroke="#9ba5b2" stroke-width="1.5"/>
  <text x="42" y="381" class="label">Choose earliest before filtering</text>
  <text x="42" y="421" class="body">1 March is selected.</text>
  <text x="42" y="453" class="body">It is outside the window.</text>
  <text x="42" y="490" class="note">The valid 15 March record is missed.</text>
  <rect x="410" y="346" width="370" height="170" rx="10" fill="#f0f8f4" stroke="#7aa58a" stroke-width="1.5"/>
  <text x="432" y="381" class="label">Filter first, then choose</text>
  <text x="432" y="421" class="body">15 March is selected.</text>
  <text x="432" y="453" class="body">It is inside the window.</text>
  <text x="432" y="490" class="note">The valid assessment is used.</text>
  <text x="400" y="552" class="note" text-anchor="middle">The same records give different answers if selection happens too soon.</text>
</svg>
