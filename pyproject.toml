[project]
name = "oa-cohorts"
dynamic = ["version"]
description = "Serialisation utilities for OMOP CDM cohorts and CQI builder"
readme = "README.md"
authors = [
    { name = "Georgie Kennedy", email = "georgina.kennedy@unsw.edu.au" }
]
requires-python = ">=3.12"
dependencies = [
    "oa-configurator>=0.1.1,<1.0.0",
    "omop-constructs>=0.5.2",
    "omop-alchemy>=0.7.0",
    "orm-loader>=0.5.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
oa-cohorts = "oa_cohorts.cli:main"

[project.entry-points."omop.config"]
oa_cohorts = "oa_cohorts.config:OaCohortsConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/oa_cohorts"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[project.optional-dependencies]
dev = [
  "ipython>=8.0",
  "tornado>=6.5.7",
  "pytest>=9.0.3",
  "pytest-cov>=4.0",
  "mypy>=1.8",
  "ty>=0.0.1a20",
  "ruff>=0.4",
  "mkdocs-material>=9.7.1",
  "mkdocstrings-python>=2.0.1",
  "mkdocs>=1.6.1",
  "requests>=2.33.0",
  "mkdocs-mermaid2-plugin"
]

docs = [
  "sphinx",
  "myst-parser",
]

[tool.ruff.lint]
ignore = [
  # typer's API requires the call in the default, as
  # FastAPI's Depends does.
  # B008 is a known false positive for both.
  "B008",
  # TODO: PEP 695 `type` aliases. 
  "UP040",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]
"src/oa_cohorts/cli/__init__.py" = ["BLE001"]
"src/oa_cohorts/core/html_utils.py" = ["BLE001"]
"src/oa_cohorts/query/query_rule.py" = ["BLE001"]
"src/oa_cohorts/query/subquery.py" = ["BLE001"]
"src/oa_cohorts/query/measure.py" = ["BLE001"]
"src/oa_cohorts/output/query_plan.py" = ["BLE001"]
"src/oa_cohorts/output/report_runner.py" = ["BLE001"]
