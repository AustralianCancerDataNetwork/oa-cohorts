[project]
name = "oa-cohorts"
version = "0.8.5"
description = "Serialisation utilities for OMOP CDM cohorts and CQI builder"
readme = "README.md"
authors = [
    { name = "Georgie Kennedy", email = "georgina.kennedy@unsw.edu.au" }
]
requires-python = ">=3.12"
dependencies = [
    "oa-configurator>=0.1.1",
    "omop-constructs>=0.5.2",
    "omop-alchemy>=0.7.0",
    "orm-loader>=0.5.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
oa-cohorts = "oa_cohorts.cli:main"

[project.entry-points."omop.config"]
oa_cohorts = "oa_cohorts.config:OaCohortsConfig"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv_build]
package-data = { "oa_cohorts" = ["**/*.css"] }

[project.optional-dependencies]
dev = [
  "ipython>=8.0",
  "tornado>=6.5.7",
  "pytest>=9.0.3",
  "pytest-cov>=4.0",
  "mypy>=1.8",
  "ruff>=0.4",
  "mkdocs-material>=9.7.1",
  "mkdocstrings-python>=2.0.1",
  "mkdocs>=1.6.1",
  "requests>=2.33.0",
  "mkdocs-mermaid2-plugin"
]

docs = [
  "sphinx",
  "myst-parser",
]
