[project]
name = "oa-cohorts"
dynamic = ["version"]
description = "Serialisation utilities for OMOP CDM cohorts and CQI builder"
readme = "README.md"
authors = [
    { name = "Georgie Kennedy", email = "georgina.kennedy@unsw.edu.au" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "oa-configurator>=1.2.1,<2",
    "omop-constructs>=0.7.0,<1",
    "omop-alchemy[postgres]>=1.1,<2",
    "orm-loader>=1.1,<2",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
oa-cohorts = "oa_cohorts.cli:main"

[project.entry-points."omop.config"]
oa_cohorts = "oa_cohorts.config:OaCohortsConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/oa_cohorts"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[project.optional-dependencies]
dev = [
  "ipython>=8.0",
  "tornado>=6.5.7",
  "pytest>=9.0.3",
  "pytest-cov>=4.0",
  "mypy>=1.8",
  "ty==0.0.61",
  # >=0.16 deliberately, and deliberately different from the rest of the stack.
  # Ruff 0.16 widened its default rule set enormously; omop-constructs and its
  # siblings pin <0.16 and treat lifting that as a stack-wide decision. This repo
  # has already made it: the 182 findings 0.16 raised were driven to zero (see
  # _dash/ruff-0.16-assessment.md for the rule-by-rule outcome, and the ignore
  # list below for what was kept). A floor of >=0.4 left that resolving to 0.16
  # by accident, so a lockfile refresh could silently drop back to 0.15 and stop
  # enforcing rules this repo has already paid for. <0.17 because the next
  # widening has not been assessed.
  "ruff>=0.16.1,<0.17",
  "mkdocs-material>=9.7.1",
  "mkdocstrings-python>=2.0.1",
  "mkdocs>=1.6.1",
  "requests>=2.33.0",
  "mkdocs-mermaid2-plugin"
]

docs = [
  "sphinx",
  "myst-parser",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The `requires_database` marker itself is registered by oa-configurator's
# pytest plugin, which skips a test when the named database is not configured
# and fails it if that database's connection is not marked test_only.

[tool.ruff.lint]
ignore = [
  # typer's API requires the call in the default, as
  # FastAPI's Depends does.
  # B008 is a known false positive for both.
  "B008",
  # TODO: PEP 695 `type` aliases. 
  "UP040",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]
"src/oa_cohorts/cli/__init__.py" = ["BLE001"]
"src/oa_cohorts/core/html_utils.py" = ["BLE001"]
"src/oa_cohorts/query/query_rule.py" = ["BLE001"]
"src/oa_cohorts/query/subquery.py" = ["BLE001"]
"src/oa_cohorts/query/measure.py" = ["BLE001"]
"src/oa_cohorts/output/query_plan.py" = ["BLE001"]
"src/oa_cohorts/output/report_runner.py" = ["BLE001"]
