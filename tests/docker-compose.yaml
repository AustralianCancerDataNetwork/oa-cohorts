# Postgres for the `requires_database("test_dashboard_db")` tests.
# See tests/README.md. Port 55433 so it cannot collide with a local server
# on 5432 or with omop-alchemy's test container on 55432.
services:
  postgres:
    image: postgres:16
    container_name: oa-cohorts-test-pg
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: oa_cohorts_test
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      timeout: 5s
      retries: 15
