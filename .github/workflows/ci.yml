name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  label-gate:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/label-gate.yml@main
  build-test-sqlite:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test.yml@main
    with:
      ty-src: src/oa_cohorts
  build-test-postgres:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test-postgres-v2.yml@main
    with:
      ty-src: src/oa_cohorts
      postgres-image: postgres:17
      postgres-db: oa_cohorts_ci
      setup-commands: |
        uv run omop-config connections add ci_pg \
          --dialect postgresql+psycopg \
          --host localhost \
          --port 5432 \
          --user test \
          --password test \
          --database-name oa_cohorts_ci \
          --test-only false
        uv run omop-config connections add ci_pg_test \
          --dialect postgresql+psycopg \
          --host localhost \
          --port 5432 \
          --user test \
          --password test \
          --database-name oa_cohorts_test_ci \
          --test-only true
        uv run omop-config databases add generic dashboard_db \
          --connection ci_pg \
          --schema-name public
        uv run omop-config databases add generic test_dashboard_db \
          --connection ci_pg_test \
          --schema-name public
        uv run omop-config configure oa_cohorts \
          --dashboard-db dashboard_db \
          --test-dashboard-db test_dashboard_db
